# Labeled Fast Recall queries for the offline benchmark (Memory Recall v2, §12).
#
# `expected` is the set of memory ids Fast Recall may select without being
# counted as a false positive; an empty list is a negative query. `context`
# picks the fixture conversation: `dm` sees the user's public and private
# memories, `guild` sees the user's public memories and the channel file.
# `case` names the fixture scenario the query covers (the spec requires at
# least one query for each of its cases).
