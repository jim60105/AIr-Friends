name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Code Quality
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: "${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}"
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify formatting
        run: bun run fmt:check

      - name: Run linter
        run: bun run lint

      - name: Type check
        run: bun run check

  test:
    name: Run Tests (${{ matrix.runner }}, userns ${{ matrix.userns }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            userns: open
          - runner: ubuntu-26.04
            userns: restricted
          - runner: ubuntu-26.04-arm
            userns: open
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: "${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}"
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build trusted extension bundle
        run: bun run bundle:omp-extension

      - name: Prepare OMP native cache
        run: |
          read -r version platform sha < <(bun --no-env-file -e 'import { OMP_NATIVE_CACHE_EXECUTABLE_SHA256, OMP_NATIVE_CACHE_VERSION, ompNativeCachePlatform } from "./src/utils/omp-native-cache.ts"; const p = ompNativeCachePlatform(); console.log(OMP_NATIVE_CACHE_VERSION, p, OMP_NATIVE_CACHE_EXECUTABLE_SHA256[p]);')
          arch="${platform#linux-}"
          curl -fsSL "https://github.com/can1357/oh-my-pi/releases/download/v${version}/omp-linux-${arch}" -o "$RUNNER_TEMP/omp"
          echo "${sha}  $RUNNER_TEMP/omp" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/omp"
          bun run prepare:omp-natives --executable "$RUNNER_TEMP/omp"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick dumb-init bubblewrap

      - name: Enable unprivileged user namespaces
        if: matrix.userns == 'open'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Prove the open environment is capable
        if: matrix.userns == 'open'
        run: |
          bun --no-env-file -e 'import { probeFilesystemConfinement, probeNetworkNamespace } from "./src/acp/sandbox-capabilities.ts";
          const network = probeNetworkNamespace();
          const filesystem = probeFilesystemConfinement();
          console.log("network namespace probe:", network, "filesystem confinement probe:", filesystem);
          if (!network) {
            console.error("::error::the open runner does not grant unprivileged network namespaces");
            process.exit(1);
          }'

      - name: Restrict unprivileged user namespaces
        if: matrix.userns == 'restricted'
        run: |
          if ! sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1; then
            echo "::warning::kernel.apparmor_restrict_unprivileged_userns is unavailable; the probes below prove the incapable path without kernel help."
            echo "USERNS_FALLBACK=1" >> "$GITHUB_ENV"
          fi

      - name: Prove the restricted environment is incapable
        if: matrix.userns == 'restricted' && env.USERNS_FALLBACK != '1'
        run: |
          bun --no-env-file -e 'import { probeFilesystemConfinement, probeNetworkNamespace } from "./src/acp/sandbox-capabilities.ts";
          const network = probeNetworkNamespace();
          const filesystem = probeFilesystemConfinement();
          console.log("network namespace probe:", network, "filesystem confinement probe:", filesystem);
          // Restricted user namespaces must make the network path incapable.
          // bwrap filesystem confinement can legitimately still work and is
          // recorded, not treated as a capability leak.
          if (network) {
            console.error("::error::the restricted runner still grants unprivileged network namespaces");
            process.exit(1);
          }'

      - name: Prove the incapable path without kernel support
        if: matrix.userns == 'restricted' && env.USERNS_FALLBACK == '1'
        run: |
          empty="$RUNNER_TEMP/empty-path"
          mkdir -p "$empty"
          PATH="$empty" "$(command -v bun)" --no-env-file -e 'import { probeFilesystemConfinement, probeNetworkNamespace } from "./src/acp/sandbox-capabilities.ts";
          const network = probeNetworkNamespace();
          const filesystem = probeFilesystemConfinement();
          console.log("Tool missing probe:", network, filesystem);
          if (network) {
            console.error("::error::the missing-tool probe still reports network-namespace capability");
            process.exit(1);
          }'

      - name: Install trusted skill config
        run: sudo sh scripts/install-skill-bunfig.sh

      - name: Run unit tests
        run: >-
          bun --no-env-file test --timeout=120000 --isolate
          tests/acp tests/core tests/dashboard tests/platforms tests/scripts
          tests/skill-api tests/skills tests/types tests/utils
          tests/main.test.ts tests/healthcheck.test.ts

      - name: Run integration tests
        run: bun --no-env-file test --timeout=120000 --isolate tests/integration

  coverage:
    name: Test Coverage
    needs: check
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: "${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}"
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build trusted extension bundle
        run: bun run bundle:omp-extension

      - name: Prepare OMP native cache
        run: |
          read -r version platform sha < <(bun --no-env-file -e 'import { OMP_NATIVE_CACHE_EXECUTABLE_SHA256, OMP_NATIVE_CACHE_VERSION, ompNativeCachePlatform } from "./src/utils/omp-native-cache.ts"; const p = ompNativeCachePlatform(); console.log(OMP_NATIVE_CACHE_VERSION, p, OMP_NATIVE_CACHE_EXECUTABLE_SHA256[p]);')
          arch="${platform#linux-}"
          curl -fsSL "https://github.com/can1357/oh-my-pi/releases/download/v${version}/omp-linux-${arch}" -o "$RUNNER_TEMP/omp"
          echo "${sha}  $RUNNER_TEMP/omp" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/omp"
          bun run prepare:omp-natives --executable "$RUNNER_TEMP/omp"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick dumb-init bubblewrap

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install trusted skill config
        run: sudo sh scripts/install-skill-bunfig.sh

      - name: Run tests with coverage
        # Isolate every test file into a fresh global: the metrics registry is
        # process-wide, and one file's increments otherwise leak into another.
        # --no-env-file keeps config-loader's environment neutral.
        run: >-
          bun --no-env-file test --timeout=120000 --isolate
          --coverage --coverage-reporter=text --coverage-reporter=lcov
          --coverage-dir=coverage tests/

      - name: Check coverage floor
        run: bun run --no-env-file scripts/coverage-floor.ts coverage/lcov.info 75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  image:
    name: Image Smoke (${{ matrix.runner }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: "${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}"
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare rootless podman
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }

      - name: Build runtime image
        run: podman build --target final -t air-friends:ci .

      - name: Build test image
        run: podman build -f tests/image/Containerfile --build-arg IMAGE=localhost/air-friends:ci -t air-friends:ci-test .

      - name: Run image smoke test
        run: sh scripts/image-smoke.sh localhost/air-friends:ci localhost/air-friends:ci-test
