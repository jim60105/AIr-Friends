# ============================================================
# AIr-Friends — Gemini CLI Permission Policies
# Mirrors agent-config/opencode.json permission rules for defense-in-depth
# ============================================================
# Priority: higher number = higher priority (overrides lower)
# Modes: rules without "modes" field are always active
# In YOLO mode: Gemini built-in yolo policy (priority 999+)
#               overrides all rules below

# ============================================================
# 1. Write/edit tools — scoped to agent workspace
# ============================================================
# Equivalent to agent-config/opencode.json:
#   "edit": { "*": "deny", "data/agent-workspace/**": "allow",
#             "$AGENT_WORKSPACE/**": "allow", "$TMPDIR/**": "allow" }
#
# Gemini Policy Engine does not support file-path scoping or
# extension-based filtering for write tools. Write permissions
# (including .md/.txt extension restriction) are enforced by:
#   - Layer 3: ACP requestPermission() allows writes only to
#     agentWorkspacePath and workspace TMPDIR, with extension checks
#   - Layer 4: writeTextFile() validates path boundaries
# No blanket deny here — Layer 3/4 provide the scoping.

# ============================================================
# 2. Deny interactive tools (no human to answer)
# ============================================================
# Equivalent to agent-config/opencode.json: "question": "deny"
# No modes filter — always denied, even in YOLO (no human)
[[rule]]
toolName = "ask_user"
decision = "deny"
priority = 200

# ============================================================
# 3. Deny save_memory (not our memory system)
# ============================================================
# Our memory system uses skills/memory-save, not Gemini native
[[rule]]
toolName = "save_memory"
decision = "deny"
priority = 200
modes = ["default", "auto_edit", "plan"]

# ============================================================
# 4. Shell commands — Default deny all
# ============================================================
# Equivalent to agent-config/opencode.json: "bash": { "*": "deny" }
[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 10
modes = ["default", "auto_edit", "plan"]

# ============================================================
# 5. Shell commands — Allow safe commands
# ============================================================
# Equivalent to agent-config/opencode.json allowed bash commands

# Allow skill scripts
[[rule]]
toolName = "run_shell_command"
commandPrefix = "deno run"
decision = "allow"
priority = 100
modes = ["default", "auto_edit", "plan"]

# Allow read-only and utility commands
[[rule]]
toolName = "run_shell_command"
commandPrefix = ["rg ", "curl ", "cat ", "head ", "tail ", "ls ", "find ", "wc "]
decision = "allow"
priority = 100
modes = ["default", "auto_edit", "plan"]

# Allow agent-browser
[[rule]]
toolName = "run_shell_command"
commandPrefix = "agent-browser"
decision = "allow"
priority = 100
modes = ["default", "auto_edit", "plan"]

# ============================================================
# 6. Shell commands — Explicitly deny dangerous commands
# ============================================================
# Equivalent to agent-config/opencode.json: "git *": "deny", "echo *": "deny", "mkdir *": "deny"
# Highest priority to override any allows
[[rule]]
toolName = "run_shell_command"
commandPrefix = ["git ", "echo ", "mkdir "]
decision = "deny"
priority = 200
modes = ["default", "auto_edit", "plan"]
