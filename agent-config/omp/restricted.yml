# Hand-authored native OMP settings for the restricted mode.
# Pinned to official OMP v18.6.1 / 2a2c6dcbbb558c0f8145f67f28b3370984f2bf60.
#
# `tools.approvalMode: write` plus exact-name `tools.approval.<name>` entries:
# every mapped native ability is allowed by name and the LSP tool is explicitly
# denied. The restricted capability extension blocks any OTHER tool name before
# dispatch, so no wildcard default-deny key is authored here (the pinned native
# schema has none).
tools:
  approvalMode: write
  approval:
    read: allow
    grep: allow
    glob: allow
    find: allow
    todo: allow
    web_search: allow
    lsp: deny
grep:
  enabled: true
glob:
  enabled: true
find:
  enabled: auto
skills:
  enabled: true
  # Stock-image shared skill root. Native `expandTilde()` resolves `~`.
  # Development/custom deployments author their actual root here AND configure
  # `agent.skillsDir` to the same root; nothing interpolates or rewrites this.
  customDirectories: ["~/.agents/skills"]
startup:
  checkUpdate: false
marketplace:
  autoUpdate: off
update:
  channel: stable
compaction:
  enabled: true
