# AIr-Friends Helm Chart Values
# See config.example.yaml in the repository for detailed configuration documentation.

image:
  repository: ghcr.io/jim60105/air-friends
  tag: latest
  pullPolicy: Always

replicas: 1

resources:
  limits:
    cpu: 1000m
    memory: 2500Mi
  requests:
    cpu: 1000m
    memory: 1000Mi

# Security context for the container
containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 0
  allowPrivilegeEscalation: false

# Security context for the pod (required for PVC write permissions)
podSecurityContext:
  fsGroup: 0
  fsGroupChangePolicy: 'OnRootMismatch'

# -- Environment variables for bot credentials and configuration.
# These are stored in a Kubernetes Secret.
env:
  # Timezone
  TZ: 'Asia/Taipei'

  # Platform tokens
  DISCORD_TOKEN: 'your-discord-bot-token'
  MISSKEY_TOKEN: 'your-misskey-access-token'
  MISSKEY_HOST: 'misskey.example.com'

  # Platform enable flags (true/false). These can override the corresponding
  DISCORD_ENABLED: 'true'
  MISSKEY_ENABLED: 'false'

  # Agent configuration
  AGENT_MODEL: 'openrouter/deepseek/deepseek-v4-pro'

  # Global reasoning effort (ACP thought_level): none|low|medium|high|xhigh|max|default
  # "default" = do not configure. Per-rule/per-section values go in config / MODEL_ROUTING_RULES.
  AGENT_REASONING_EFFORT: 'default'

  # Default ACP agent type (opencode)
  AGENT_DEFAULT_TYPE: 'opencode'

  # Bootstrap OpenCode version-check minimum (observability only, never blocks startup).
  # WARNs (marker BELOW_MINIMUM/UNKNOWN) when the installed opencode CLI is below this.
  # Default 1.17.13. Not a functional gate — the container pins the version via
  # Containerfile OPENCODE_VERSION + per-arch SHA-256 checksums.
  # AGENT_OPENCODE_MIN_VERSION: '1.17.13'

  # Skills directory path (default: skills)
  AGENT_SKILLS_DIR: '/home/deno/.agents/skills'

  # Model routing
  MODEL_ROUTING_ENABLED: 'false'
  MODEL_ROUTING_RULES: '[]'

  # External MCP Servers (JSON string array)
  AGENT_MCP_SERVERS: '[]'

  # Dry Run / Debug Mode
  # DRY_RUN_ENABLED: 'false'
  # DRY_RUN_OUTPUT_PATH: './data/dry-run/'
  # DRY_RUN_MOCK_REPLY: '（Dry run 模式 — 此為測試回覆）'

  # Logging
  LOG_LEVEL: 'INFO'

  # Environment
  DENO_ENV: 'development'

  # Agent provider API keys
  # OpenCode API Key (optional)
  OPENCODE_API_KEY: 'your-opencode-api-key'
  # OpenRouter API Key (optional - for OpenRouter provider)
  OPENROUTER_API_KEY: 'your-openrouter-api-key'
  # Gemini API Key for the OpenCode Gemini provider (optional)
  GEMINI_API_KEY: 'your-gemini-api-key'
  # GitHub Token (used by the git backup / git credential store; optional)
  GITHUB_TOKEN: 'github_pat_your-token-here'

  # Reply Policy & Channel Settings (all|public|channels)
  REPLY_POLICY: 'channels'
  # JSON string of channel configurations. Example:
  # [{"id":"discord/account/123","spontaneousPost":true},{"id":"discord/channel/456","channelLurk":true}]
  CHANNELS: ''

  # Spontaneous post settings - Discord
  DISCORD_SPONTANEOUS_ENABLED: 'false'
  DISCORD_SPONTANEOUS_MIN_INTERVAL_MS: '10800000'
  DISCORD_SPONTANEOUS_MAX_INTERVAL_MS: '43200000'
  DISCORD_SPONTANEOUS_CONTEXT_FETCH_PROBABILITY: '0.5'

  # Discord typing indicator
  DISCORD_TYPING_INDICATOR_ENABLED: 'false'

  # Channel Lurk Reply (Discord only)
  DISCORD_CHANNEL_LURK_ENABLED: 'false'
  DISCORD_CHANNEL_LURK_INTERVAL_MS: '1800000'

  # Spontaneous post settings - Misskey
  MISSKEY_SPONTANEOUS_ENABLED: 'false'
  MISSKEY_SPONTANEOUS_MIN_INTERVAL_MS: '10800000'
  MISSKEY_SPONTANEOUS_MAX_INTERVAL_MS: '43200000'
  MISSKEY_SPONTANEOUS_CONTEXT_FETCH_PROBABILITY: '0.5'

  # GELF Logging configuration
  GELF_ENABLED: 'false'
  GELF_ENDPOINT: 'http://your-gelf-endpoint:12201'
  GELF_HOSTNAME: 'air-friends'
  GELF_PROTOCOL: 'http'
  GELF_COMPRESS: 'true'

  # Per-chunk agent stream debug logging (Agent thought:/Agent message chunk: DEBUG lines).
  # 'true'/'false' (default: false).
  LOGGING_AGENT_STREAM_CHUNKS: 'false'

  # RSS Feed Research Settings
  SELF_RESEARCH_ENABLED: 'false'
  SELF_RESEARCH_MODEL: 'openrouter/anthropic/claude-opus-4.8'
  # RSS feeds: prefer using selfResearchRssFeeds section below (native YAML).
  # Only set this if you need to override selfResearchRssFeeds with a raw JSON string.
  # SELF_RESEARCH_RSS_FEEDS: '[{"url":"https://example.com/feed.xml","name":"Tech News"}]'
  SELF_RESEARCH_MIN_INTERVAL_MS: '43200000'
  SELF_RESEARCH_MAX_INTERVAL_MS: '86400000'
  # Verify a self-research session produced a note before counting it as successful
  # (with one corrective retry otherwise). 'true'/'false' (default: true).
  SELF_RESEARCH_VERIFY_COMPLETION: 'true'

  # Rate Limiting
  RATE_LIMIT_ENABLED: 'false'
  RATE_LIMIT_MAX_REQUESTS_PER_WINDOW: '10'
  RATE_LIMIT_WINDOW_MS: '600000'
  RATE_LIMIT_COOLDOWN_MS: '600000'

  # Prometheus Metrics
  METRICS_ENABLED: 'false'
  METRICS_PATH: '/metrics'

  # Git Backup - backs up data/ directory to a remote Git repository
  GIT_BACKUP_ENABLED: 'false'
  GIT_BACKUP_REMOTE_URL: 'https://github.com/your-username/your-backup-repo.git'
  GIT_BACKUP_INTERVAL_MS: '3600000'
  GIT_BACKUP_AUTHOR_NAME: 'AIr-Friends Backup'
  GIT_BACKUP_AUTHOR_EMAIL: 'airfriends-backup@noreply.github.com'
  GIT_BACKUP_AUTH_USER: ''
  GIT_BACKUP_AUTH_PASSWORD: ''

  # Scheduled Reminders
  REMINDERS_ENABLED: ''
  REMINDERS_MAX_PER_USER: ''
  REMINDERS_MIN_INTERVAL_MS: ''
  REMINDERS_PERSIST_PATH: ''
  REMINDERS_CHECK_INTERVAL_MS: ''

  # Send File Skill
  SKILL_SEND_FILE_ENABLED: 'false'
  SKILL_SEND_FILE_MAX_SIZE_MB: '25'
  SKILL_SEND_FILE_ALLOWED_EXTENSIONS: ''
  SKILL_SEND_FILE_MAX_FILES_PER_INVOCATION: '10'
  SKILL_SEND_FILE_MAX_TOTAL_SIZE_MB: '50'

  # Agent Sandbox
  AGENT_SANDBOX_FILTER_ENV: 'true'
  # Full network-namespace isolation. Leave 'false' and use the egress proxy below — full
  # isolation gives the agent an empty network namespace and severs its Skill API loopback.
  AGENT_SANDBOX_NETWORK_ISOLATION: 'false'
  AGENT_SANDBOX_ALLOWED_ENV_VARS: ''
  AGENT_SANDBOX_ALLOWED_WRITE_EXTENSIONS: '.md,.txt'
  # F12 D4: OPT-IN (default false). Confine the agent's filesystem via bubblewrap (hides
  # /proc/1/environ and other users' workspaces). Mounts a fresh /proc, which fails inside a
  # doubly-nested user namespace (rootless podman) — verify with scripts/probe-sandbox-caps.sh
  # against your actual SCC/node, then set 'true'. Fails closed when enabled but unavailable.
  # On Kubernetes the full requirement chain is: node sysctl user.max_user_namespaces > 0,
  # a non-default seccomp profile (the containerd default gates unshare on CAP_SYS_ADMIN),
  # and an unmasked /proc (securityContext.procMount: Unmasked), which since K8s 1.30 requires
  # hostUsers: false and therefore containerd 2.0+ / CRI-O 1.25+. See docs/AGENT_PERMISSIONS.md.
  AGENT_SANDBOX_FILESYSTEM_CONFINEMENT: 'false'
  # F14: mediate agent egress (webfetch/websearch/agent-browser) through the validating proxy.
  AGENT_SANDBOX_EGRESS_PROXY: 'true'
  AGENT_SANDBOX_EGRESS_PROXY_PORT: '0'
  # Explicit opt-in to unmediated egress (only for trusted single-tenant deployments).
  AGENT_SANDBOX_UNRESTRICTED_EGRESS: 'false'
  # Operator-trusted egress destinations exempt from the proxy's disallowed-range rejection
  # (comma-separated bare hostnames or literal IPs — no scheme/port/path). Each entry is an
  # operator-audited trust grant: prefer literal IPs or cluster-internal service names, and
  # note a loopback entry exposes ALL loopback ports (dashboard, Skill API), not just the
  # intended service. Cloud-metadata addresses stay blocked regardless of this list.
  # Example: '192.168.1.10,internal-proxy'
  AGENT_SANDBOX_EGRESS_ALLOW_HOSTS: ''

  # Agent Idle Timeout
  AGENT_IDLE_TIMEOUT_ENABLED: 'true'
  AGENT_IDLE_TIMEOUT_MS: '300000'
  AGENT_IDLE_TIMEOUT_CHECK_INTERVAL_MS: '30000'

  # Shared ACP Process Pool (per-pool-key long-lived opencode acp + global execution lease)
  AGENT_SHARED_PROCESS_ENABLED: 'false'
  # AGENT_SHARED_PROCESS_RECLAIM_IDLE_MS: '1800000'
  # AGENT_SHARED_PROCESS_JWT_DIR: 'data/skill-jwt'
  # AGENT_SHARED_PROCESS_SECRET_PATH: 'data/skill-secret'
  # AGENT_SHARED_PROCESS_QUEUE_DEADLINE_MS: '600000'
  # Skill API deployment secret override (256-bit, 32+ bytes)
  # AGENT_SKILL_API_SECRET: ''

  ## Git Credential Store (for agent subprocess, YOLO mode only)
  # AGENT_GIT_CREDENTIAL_ENABLED: 'false'
  # AGENT_GIT_CREDENTIAL_HOST: 'github.com'

  # External skills to install at startup
  # Prefer using agentExternalSkills section below (native YAML).
  # Only set this if you need to override agentExternalSkills with a raw JSON string.
  # AGENT_EXTERNAL_SKILLS: '[{"repo":"jim60105/copilot-prompt","skill":"create-blog-post"}]'

  # Skill Auto-Approve List (comma-separated skill names for restricted/non-YOLO mode)
  # When empty or not set, falls back to scanning the built-in skills directory.
  # AGENT_AUTO_APPROVE_SKILLS: "memory-save,memory-search,memory-patch,memory-stats,memory-export,fetch-context,send-reply,edit-reply,send-file,react-message,set-reminder,list-reminders,cancel-reminder,self-research,agent-browser"

  # Memory Tiered Architecture
  MEMORY_WORKING_TIER_LIMIT: '20'

  # Conversation Summary (auto-generated after each session)
  CONVERSATION_SUMMARY_ENABLED: 'true'
  CONVERSATION_SUMMARY_MODEL: ''

  # Session Audit Log
  AUDIT_ENABLED: ''
  AUDIT_RETENTION_DAYS: ''
  AUDIT_HASH_CONTENT: ''
  AUDIT_INCLUDED_PHASES: ''

  # Web Dashboard
  # NOTE: For K8s, prefer leaving DASHBOARD_HOST and DASHBOARD_BEHIND_HTTPS_PROXY
  # empty. When dashboard.service.enabled=true the chart auto-sets DASHBOARD_HOST
  # to "0.0.0.0" (the app defaults to 127.0.0.1, which is unreachable from the
  # ClusterIP Service inside the pod), and when the dashboard Ingress terminates
  # TLS it auto-sets DASHBOARD_BEHIND_HTTPS_PROXY=true (for the Secure cookie).
  # Set values here only to explicitly override that behavior.
  DASHBOARD_ENABLED: ''
  DASHBOARD_PORT: ''
  DASHBOARD_HOST: ''
  DASHBOARD_PASSPHRASE: ''
  DASHBOARD_BEHIND_HTTPS_PROXY: ''
  # Comma-separated real connection addresses whose X-Forwarded-For is trusted for
  # login rate-limit keying. When exposed via Ingress, set this to your ingress
  # controller / proxy pod IP(s) so per-client rate limiting keys on the real
  # client IP instead of the shared proxy address.
  DASHBOARD_TRUSTED_PROXIES: ''

# -- Self-research RSS feeds (native YAML, easier than JSON env var).
# When selfResearchRssFeeds is non-empty, it takes precedence over
# SELF_RESEARCH_RSS_FEEDS env var.
selfResearchRssFeeds: []
  # Example:
  # - url: "https://example.com/feed.xml"
  #   name: "Tech News"
  # - url: "https://another.example.com/rss"
  #   name: "Science Daily"

# -- External skills to install at startup (native YAML, easier than JSON env var).
# When agentExternalSkills is non-empty, it takes precedence over
# AGENT_EXTERNAL_SKILLS env var.
agentExternalSkills: []
  # Example:
  # - repo: "jim60105/copilot-prompt"
  #   skill: "create-blog-post"

# -- Skill Auto-Approve List (native YAML, easier than comma-separated env var).
# When agentAutoApproveSkills is non-empty, it takes precedence over
# AGENT_AUTO_APPROVE_SKILLS env var.
agentAutoApproveSkills: []
  # Example (list all built-in skills + any external skills to auto-approve):
  # - "memory-save"
  # - "memory-search"
  # - "memory-patch"
  # - "memory-stats"
  # - "memory-export"
  # - "fetch-context"
  # - "send-reply"
  # - "edit-reply"
  # - "send-file"
  # - "react-message"
  # - "set-reminder"
  # - "list-reminders"
  # - "cancel-reminder"
  # - "self-research"
  # - "agent-browser"
  # - "create-blog-post"  # external skill

# -- Model routing configuration (native YAML, easier than JSON env var).
# When modelRouting.enabled is true, this section takes precedence over
# MODEL_ROUTING_ENABLED and MODEL_ROUTING_RULES env vars.
# Rules are evaluated in order (first-match wins).
# All conditions in a rule's match are AND-combined; contentKeywords entries are OR-combined.
modelRouting:
  enabled: false
  rules: []
  # Example rules:
  #   - match:
  #       channel: "discord/account/12345678901234567"
  #       contentKeywords: ["研究", "research"]
  #     model: "openrouter/google/gemini-2.5-pro"
  #   - match:
  #       contentKeywords: ["研究", "research", "論文", "paper"]
  #     model: "openrouter/google/gemini-2.5-pro"
  #   - match: { channel: "discord/account/12345678901234567" }
  #     model: "openrouter/deepseek/deepseek-v3.2"
  #   - match: { sessionType: "spontaneous" }
  #     model: "openrouter/deepseek/deepseek-v3.2"

# -- Reply policy (native YAML).
replyPolicy: "channels"

# -- Channel configurations (native YAML, easier than JSON env var).
# When channels is non-empty, it takes precedence over CHANNELS env var.
channels: []
  # Example:
  # - id: "discord/account/123456789012345678"
  #   enabled: true
  #   spontaneousPost: false
  #   rateLimitBypass: true
  # - id: "discord/channel/987654321098765432"
  #   enabled: true
  #   spontaneousPost: true
  #   channelLurk: true
  # - id: "misskey/timeline/self"
  #   spontaneousPost: true

# ServiceMonitor for Prometheus Operator (optional)
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  namespace: ""
  additionalLabels: {}

# -- Extra environment variables to add to the container (list of name/value pairs).
extraEnv: []
#  - name: DENO_ENV
#    value: "prod"

# Persistent volume for bot data (workspaces and memory)
persistence:
  enabled: true
  storageClass: 'openebs-jiva-csi-default'
  accessModes:
    - ReadWriteOnce
  size: 200Mi
  # -- Use an existing PVC instead of creating a new one.
  existingClaim: ''

# -- Mount custom prompt files via a ConfigMap.
# Set enabled=true and provide prompt file contents to override specific prompt files.
# Only the files you specify will be overridden; others keep their container defaults.
prompts:
  enabled: false
  # -- Map of filename -> content for prompt files to mount at /app/prompts.
  # Only include the files you want to override.
  files: {}
  #   character_name.md: |
  #     Yuna
  #   character_info.md: |
  #     An AI assistant

# -- Persistent volume for OpenCode auth state (OAuth refresh tokens).
# This file is regularly renewed by OpenCode CLI in the container, so it must be writable.
# Dashboard exposure configuration
# Creates Kubernetes Service and optional Ingress for the web dashboard.
# The dashboard application is controlled by env.DASHBOARD_ENABLED / env.DASHBOARD_PORT above.
dashboard:
  service:
    enabled: false
    type: ClusterIP
    port: 8090
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # -- Example: Traefik Ingress with TLS and middleware
    #   traefik.ingress.kubernetes.io/router.entrypoints: websecure
    #   traefik.ingress.kubernetes.io/router.tls: "true"
    #   traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
    #   cert-manager.io/cluster-issuer: letsencrypt
    # -- Example: nginx-ingress
    #   nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts: []
    # -- Example:
    #   - host: dashboard.example.com
    #     paths:
    #       - path: /
    #         pathType: Prefix
    tls: []
    # -- Example:
    #   - secretName: dashboard-tls
    #     hosts:
    #       - dashboard.example.com

# Health check endpoint configuration
health:
  port: 8080

# Service configuration (exposes health check endpoint within cluster)
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# ServiceAccount configuration
# AIr-Friends does not call the Kubernetes API, so token automounting is disabled by default.
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account (e.g. for IRSA or Workload Identity)
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# Kubernetes-specific settings
kubernetes:
  clusterDomain: cluster.local
