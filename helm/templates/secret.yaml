---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "air-friends.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "air-friends.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.env }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.selfResearchRssFeeds }}
  SELF_RESEARCH_RSS_FEEDS: {{ .Values.selfResearchRssFeeds | toJson | quote }}
  {{- end }}
  {{- if .Values.agentExternalSkills }}
  AGENT_EXTERNAL_SKILLS: {{ .Values.agentExternalSkills | toJson | quote }}
  {{- end }}
  {{- if .Values.agentAutoApproveSkills }}
  AGENT_AUTO_APPROVE_SKILLS: {{ .Values.agentAutoApproveSkills | join "," | quote }}
  {{- end }}
  {{- if .Values.modelRouting.enabled }}
  MODEL_ROUTING_ENABLED: "true"
  MODEL_ROUTING_RULES: {{ .Values.modelRouting.rules | toJson | quote }}
  {{- end }}
  {{- if .Values.channels }}
  CHANNELS: {{ .Values.channels | toJson | quote }}
  {{- end }}
  {{- if .Values.replyPolicy }}
  REPLY_POLICY: {{ .Values.replyPolicy | quote }}
  {{- end }}
  {{- /*
    Dashboard networking defaults for the K8s Service/Ingress topology.
    The dashboard app binds to 127.0.0.1 by default, which is unreachable from a
    ClusterIP Service / kube-proxy / Ingress inside the pod network namespace.
    When the dashboard Service is enabled, bind to 0.0.0.0 so the Service can
    reach it. When the dashboard Ingress terminates TLS, mark the app as being
    behind an HTTPS-terminating proxy so the session cookie gets the Secure flag.
    Both are only applied when the user has not set an explicit override in .Values.env.
  */ -}}
  {{- if .Values.dashboard.service.enabled }}
  {{- if not .Values.env.DASHBOARD_HOST }}
  DASHBOARD_HOST: "0.0.0.0"
  {{- end }}
  {{- if and .Values.dashboard.ingress.enabled .Values.dashboard.ingress.tls (not .Values.env.DASHBOARD_BEHIND_HTTPS_PROXY) }}
  DASHBOARD_BEHIND_HTTPS_PROXY: "true"
  {{- end }}
  {{- end }}
