{{- if .Values.dashboard.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "air-friends.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "air-friends.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    app: air-friends
    {{- include "air-friends.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.dashboard.service.port }}
      targetPort: {{ .Values.env.DASHBOARD_PORT | default 8090 }}
      name: dashboard
{{- end }}
